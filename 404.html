<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>페이지를 찾을 수 없습니다 — Scouting App</title>
  <meta name="theme-color" content="#f3f1f7" />
  <link rel="icon" type="image/png" href="/jamboree/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#1E1730;--muted:#5c5568;--soft:#7c7589;--line:#e6def4;--accent:#6336B5;--bg:#f3f1f7}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hanken Grotesk',system-ui,sans-serif;
         line-height:1.6;-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto;padding:56px 20px 72px}
    .card{background:#fff;border:1px solid var(--line);border-radius:20px;
          box-shadow:0 18px 50px rgba(30,18,55,.08);padding:36px 32px}
    .emblem{width:48px;height:48px;display:block;margin-bottom:20px}
    .code{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:13px;
          letter-spacing:.1em;color:var(--soft);margin:0 0 10px}
    h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;letter-spacing:-.02em;
       font-size:26px;line-height:1.25;margin:0 0 14px}
    p{margin:0 0 13px;font-size:15px;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
    .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
         padding:0 20px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;
         border:1px solid transparent;transition:background .15s,border-color .15s}
    .btn.primary{background:var(--accent);color:#fff}
    .btn.primary:hover{background:#52299b}
    .foot{margin-top:24px;padding-top:16px;border-top:1px solid #efe9f7;font-size:13px;color:var(--soft)}
    @media(max-width:560px){.wrap{padding:36px 16px 56px}.card{padding:28px 20px}h1{font-size:23px}
      .actions .btn{flex:1 1 100%}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="emblem" src="/jamboree/assets/logo.png" width="48" height="48" alt="" />
      <p class="code">404 NOT FOUND</p>
      <h1>이 주소에는<br />아무것도 없습니다.</h1>
      <p>주소가 잘못됐거나, 그 페이지가 이제 운영되지 않습니다. 아래에서 살아 있는 도구 목록을 확인하세요.</p>
      <div class="actions">
        <a class="btn primary" href="/">도구 모음으로 가기</a>
      </div>
      <div class="foot">Scouting App · scoutingapp.net</div>
    </div>
  </div>
</body>
</html>
