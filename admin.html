<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>운영 현황 — scoutingapp.net</title>
<meta name="theme-color" content="#F4F2F7" />
<link rel="icon" type="image/png" href="/jamboree/assets/logo.png" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/admin/admin.css?v=0.9.257" />
</head>
<body>

<!-- ── TOTP 잠금 ── 인증 전에는 이 화면만 보인다 -->
<div class="gate" id="gate">
  <form class="gatebox" id="gate-form" autocomplete="off">
    <img src="/jamboree/assets/logo.png" alt="" width="52" height="52" />
    <h1>운영 현황</h1>
    <p>관리자 인증 앱의 <b>6자리 코드</b>를 입력하세요.</p>
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           placeholder="000000" aria-label="6자리 인증 코드" autocomplete="one-time-code" />
    <button class="btn solid" id="gate-go" type="submit">확인</button>
    <div class="gate-msg" id="gate-msg" role="status"></div>
    <a class="gate-back" href="/">← 도구 모음으로</a>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <header class="top">
    <a class="brand" href="/admin">
      <img src="/jamboree/assets/logo.png" alt="" width="30" height="30" />
      <span><b>운영 현황</b><em>scoutingapp.net</em></span>
    </a>
    <span class="spacer"></span>
    <div class="seg" id="rangeseg" role="group" aria-label="기간">
      <button type="button" data-days="7">7일</button>
      <button type="button" data-days="14" class="on">14일</button>
      <button type="button" data-days="30">30일</button>
    </div>
    <button class="btn" id="reload" type="button">새로고침</button>
    <button class="btn ghost" id="logout" type="button">잠그기</button>
  </header>

  <main class="main">
    <section class="sec">
      <h2 class="sec-h">유입 현황</h2>
      <p class="lead">각 화면이 <b>몇 번 열렸는지</b>(PV)입니다. 방문자 수가 아니고, 개인정보는 저장하지 않습니다.</p>
      <div class="cards" id="sumcards"></div>
      <div class="card"><div class="chart" id="chart"></div></div>
      <div class="card tblwrap"><table class="tbl" id="hittbl"></table></div>
    </section>

    <section class="sec">
      <h2 class="sec-h">라우팅 현황</h2>
      <p class="lead">지금 이 브라우저에서 각 주소를 직접 열어 응답을 확인합니다.</p>
      <div class="card tblwrap"><table class="tbl" id="routetbl"></table></div>
    </section>

    <section class="sec">
      <h2 class="sec-h">배포 · 검증</h2>
      <p class="lead">배포 시점에 기록된 값입니다. 회귀는 작업자 컴퓨터에서 돌기 때문에 <b>진행 중</b>인 상태는 여기 오지 않습니다.</p>
      <div class="card" id="deploybox">불러오는 중…</div>
    </section>
  </main>
</div>

<script src="/admin/admin.js?v=0.9.257"></script>
</body>
</html>
