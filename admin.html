<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>운영 대시보드 — scoutingapp.net</title>
<meta name="theme-color" content="#F4F2F7" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23622599'/%3E%3Ctext x='16' y='22' font-family='system-ui' font-size='17' font-weight='800' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="/admin/admin.css?v=0.9.264" />
</head>
<body>

<!-- ── TOTP 잠금 ── 인증 전에는 이 화면만 -->
<div class="gate" id="gate">
  <form class="gatebox" id="gate-form" autocomplete="off">
    <span class="mark" aria-hidden="true">S</span>
    <h1>운영 대시보드</h1>
    <p>관리자 인증 앱의 <b>6자리 코드</b>를 입력하세요.</p>
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
           placeholder="000000" aria-label="6자리 인증 코드" autocomplete="one-time-code" />
    <button class="btn solid" id="gate-go" type="submit">확인</button>
    <div class="gate-msg" id="gate-msg" role="status"></div>
    <a class="gate-back" href="/">← 도구 모음으로</a>
  </form>
</div>

<div class="app" id="shell" hidden>
  <!-- ── 좌측 메뉴 ── 관리 항목을 성격별로 나눈다 -->
  <aside class="side" id="side">
    <a class="sidebrand" href="/admin">
      <span class="mark sm" aria-hidden="true">S</span>
      <span><b>운영 대시보드</b><em>scoutingapp.net</em></span>
    </a>
    <nav class="sidenav" id="sidenav" aria-label="관리 항목"></nav>
    <div class="sidefoot">
      <div class="livechip" id="livechip" title="자동 새로고침 상태">—</div>
      <button class="btn ghost sm" id="logout" type="button">잠그기</button>
    </div>
  </aside>
  <div class="sidemask" id="sidemask" hidden></div>

  <div class="wrap">
    <header class="top">
      <button class="iconbtn menubtn" id="btn-menu" aria-label="메뉴" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      </button>
      <h1 class="topttl" id="view-title">개요</h1>
      <span class="spacer"></span>
      <div class="seg" id="rangeseg" role="group" aria-label="유입 기간">
        <button type="button" data-days="7">7일</button>
        <button type="button" data-days="14" class="on">14일</button>
        <button type="button" data-days="30">30일</button>
      </div>
      <button class="btn" id="reload" type="button">새로고침</button>
    </header>

    <main class="main" id="views"></main>
  </div>
</div>

<script src="/admin/admin.js?v=0.9.264"></script>
</body>
</html>
