<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<meta property="og:type" content="website" />

<meta property="og:url" content="https://scoutingapp.net/krjam-fnc" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="제16회 한국잼버리 급식편의본부 운영 안내" />
<meta name="twitter:description" content="The 16th KNJ Food Service &amp; Convenience Division — 운영요원(IST) 안내" />
<meta name="twitter:image" content="https://scoutingapp.net/krjam-fnc/assets/og-fnc.png" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="preload" as="image" href="/jamboree/assets/logo.png" fetchpriority="high" />
<link rel="stylesheet" href="/krjam-fnc/board.css?v=0.9.280" />
</head>
<body>

<!-- ── 좌측 내비게이션 (모바일에서는 하단 탭) ── -->
<aside class="side" id="side" aria-label="메뉴">
  <a class="sidebrand" href="/krjam-fnc">
    <img src="/jamboree/assets/logo.png" alt="" width="34" height="34" />
    <span>
      <b>급식편의본부</b>
      <em>제16회 한국잼버리 · IST 안내</em>
    </span>
  </a>
  <nav class="sidenav" id="sidenav" aria-label="섹션"></nav>
  <div class="sidefoot">
    <a class="btn ghost sm" id="btn-pdf" href="/krjam-fnc/assets/KNJ16-FnC-Orientation.pdf"
       download="제16회 한국잼버리 급식편의본부 오리엔테이션.pdf">원본 PDF 내려받기</a>
  </div>
</aside>
<div class="sidemask" id="sidemask" hidden></div>

<div class="wrap">
  <!-- ── 상단 바 ── -->
  <header class="top">
    <button class="iconbtn menubtn" id="btn-menu" aria-label="메뉴 열기" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    </button>
    <h1 class="topttl" id="view-title">대시보드</h1>
    <div class="topsearch">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="찾기 (식권 · 입영 · 북카페 …)" aria-label="내용 찾기" autocomplete="off" />
      <button class="iconbtn sx" id="search-x" hidden aria-label="검색 지우기">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="topwx" id="fnc-wx" title="강원 고성 날씨"></div>
    <div class="topnow" id="topnow" title="지금 시각"></div>
    <button class="btn ghost sm" id="fnc-admin-btn" aria-label="관리자 로그인">관리자</button>
  </header>

  <main class="main" id="main">
    <div class="searchres" id="searchres" hidden></div>
    <div id="views"></div>
  </main>

  <!-- ── 모바일 하단 탭 ── -->
  <nav class="tabbar" id="tabbar" aria-label="빠른 이동"></nav>
</div>

<!-- 도표 크게 보기 — 원문 페이지 그림을 그 자리에서 확대한다 -->
<div class="lightbox" id="lightbox" hidden></div>

<!-- 급식 관리자 로그인 (admin/admin) -->
<div class="fnclogin" id="fnc-login" hidden>
  <div class="fnclogin-box" role="dialog" aria-modal="true" aria-label="급식 관리자 로그인">
    <h2>급식 관리자 로그인</h2>
    <p class="muted">운영요원 개인정보 열람 · 내용/텍스트 수정 · 식사 메뉴 편집을 하려면 로그인하세요.</p>
    <input id="fl-id" type="text" placeholder="아이디" autocomplete="username" autocapitalize="off" spellcheck="false" />
    <input id="fl-pw" type="password" placeholder="비밀번호" autocomplete="current-password" />
    <p class="fl-err" id="fl-err" hidden></p>
    <div class="fl-acts">
      <button type="button" class="btn ghost sm" id="fl-cancel">취소</button>
      <button type="button" class="btn solid sm" id="fl-go">로그인</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/krjam-fnc/board.js?v=0.9.280"></script>
<script src="/version-watch.js?v=0.9.280"></script>
</body>
</html>
